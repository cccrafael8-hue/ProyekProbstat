<!-- ============ PANEL 2: STATISTIK DESKRIPTIF ============ -->
<section id="panel-deskriptif" class="panel">
  <h2>Statistik deskriptif</h2>

  <div class="kartu">
    <h3>Variabel numerik</h3>
    <div id="daftar-numerik" class="daftar-centang"></div>
    <button type="button" id="btn-deskriptif" class="btn btn-utama">Hitung statistik</button>
  </div>

  <div class="tabel-wrap">
    <table id="tabel-deskriptif" class="tabel">
      <thead>
        <tr>
          <th>Variabel</th>
          <th>N</th>
          <th>Rata-rata</th>
          <th>Median</th>
          <th>Std. deviasi</th>
          <th>Min</th>
          <th>Maks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="kartu">
    <h3>Tabel frekuensi</h3>
    <div class="field">
      <label for="pilih-kategori">Variabel kategori</label>
      <select id="pilih-kategori"></select>
    </div>
    <div class="tabel-wrap">
      <table id="tabel-frekuensi" class="tabel">
        <thead>
          <tr>
            <th>Kategori</th>
            <th>Frekuensi</th>
            <th>Persen (%)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

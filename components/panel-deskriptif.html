<!-- ============ PANEL 2: STATISTIK DESKRIPTIF ============ -->
<section id="panel-deskriptif" class="panel">

  <div class="panel-header">
    <h2>Statistik deskriptif</h2>
    <span class="panel-badge">Ringkasan</span>
  </div>

  <div class="kartu kartu-accent">
    <h3>Pilih variabel numerik</h3>
    <div id="daftar-numerik" class="daftar-centang"></div>
    <button type="button" id="btn-deskriptif" class="btn btn-utama">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      Hitung statistik
    </button>
  </div>

  <div class="tabel-wrap">
    <table id="tabel-deskriptif" class="tabel">
      <thead>
        <tr>
          <th>Variabel</th>
          <th>N</th>
          <th>Rata-rata</th>
          <th>Median</th>
          <th>Std. deviasi</th>
          <th>Min</th>
          <th>Maks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="kartu">
    <h3>Tabel frekuensi</h3>
    <div class="field">
      <label for="pilih-kategori">Variabel kategori</label>
      <select id="pilih-kategori"></select>
    </div>
    <div class="tabel-wrap">
      <table id="tabel-frekuensi" class="tabel">
        <thead>
          <tr>
            <th>Kategori</th>
            <th>Frekuensi</th>
            <th>Persen (%)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</section>

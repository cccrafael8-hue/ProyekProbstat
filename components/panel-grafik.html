<!-- ============ PANEL 4: VISUALISASI ============ -->
<section id="panel-grafik" class="panel">

  <div class="panel-header">
    <h2>Visualisasi</h2>
    <span class="panel-badge">Chart Builder</span>
  </div>

  <div class="grid-grafik">

    <!-- Pengaturan grafik -->
    <div class="kartu pengaturan-grafik kartu-accent">
      <h3>Pengaturan grafik</h3>

      <div class="field">
        <label for="jenis-grafik">Jenis grafik</label>
        <select id="jenis-grafik">
          <option value="bar">Bar</option>
          <option value="line">Garis</option>
          <option value="scatter">Scatter</option>
          <option value="histogram">Histogram</option>
          <option value="pie">Pie</option>
        </select>
      </div>

      <div class="field">
        <label for="sumbu-x">Sumbu X</label>
        <select id="sumbu-x" class="pilih-semua"></select>
      </div>

      <div class="field">
        <label for="sumbu-y">Sumbu Y</label>
        <select id="sumbu-y" class="pilih-numerik"></select>
      </div>

      <div class="field" id="field-kelompok">
        <label for="pilih-kelompok">Pisahkan berdasarkan <em>(opsional)</em></label>
        <select id="pilih-kelompok" class="pilih-semua-opsional"></select>
      </div>

      <div class="field" id="field-agregasi">
        <label for="agregasi">Ringkasan nilai</label>
        <select id="agregasi">
          <option value="mean">Rata-rata</option>
          <option value="sum">Jumlah</option>
          <option value="count">Banyak data</option>
          <option value="min">Minimum</option>
          <option value="max">Maksimum</option>
        </select>
      </div>

      <div class="field" id="field-bin" hidden>
        <label for="jumlah-bin">Jumlah interval</label>
        <input type="number" id="jumlah-bin" min="2" max="50" value="8">
      </div>

      <div class="section-divider">Kustomisasi</div>

      <div class="field">
        <label for="judul-grafik">Judul grafik</label>
        <input type="text" id="judul-grafik" placeholder="Contoh: Distribusi Nilai Ujian">
      </div>

      <div class="field">
        <label for="label-x">Label sumbu X</label>
        <input type="text" id="label-x">
      </div>

      <div class="field">
        <label for="label-y">Label sumbu Y</label>
        <input type="text" id="label-y">
      </div>

      <div class="field field-baris">
        <input type="checkbox" id="tampil-legenda" checked>
        <label for="tampil-legenda">Tampilkan legenda</label>
      </div>

      <button type="button" id="btn-buat-grafik" class="btn btn-utama" style="width:100%;margin-top:0.5rem;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
        Buat grafik
      </button>
    </div>

    <!-- Area grafik -->
    <div class="kartu area-grafik" style="margin-bottom:0;">
      <div class="kanvas-wrap kanvas-besar">
        <canvas id="kanvas-grafik"></canvas>
      </div>
      <p id="kosong-grafik" class="catatan" style="text-align:center;padding:1rem 0;">
        Pilih jenis grafik dan variabel, lalu klik <strong>Buat grafik</strong>.
      </p>
      <button type="button" id="btn-unduh-grafik" class="btn btn-sekunder" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Unduh grafik (PNG)
      </button>
    </div>

  </div>
</section>

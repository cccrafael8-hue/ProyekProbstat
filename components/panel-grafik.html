<!-- ============ PANEL 4: VISUALISASI ============ -->
<section id="panel-grafik" class="panel">
  <h2>Visualisasi</h2>

  <div class="grid-grafik">

    <!-- Pengaturan grafik -->
    <div class="kartu pengaturan-grafik">
      <h3>Pengaturan grafik</h3>

      <div class="field">
        <label for="jenis-grafik">Jenis grafik</label>
        <select id="jenis-grafik">
          <option value="bar">Bar</option>
          <option value="line">Garis</option>
          <option value="scatter">Scatter</option>
          <option value="histogram">Histogram</option>
          <option value="pie">Pie</option>
        </select>
      </div>

      <div class="field">
        <label for="sumbu-x">Sumbu X</label>
        <select id="sumbu-x" class="pilih-semua"></select>
      </div>

      <div class="field">
        <label for="sumbu-y">Sumbu Y</label>
        <select id="sumbu-y" class="pilih-numerik"></select>
      </div>

      <div class="field" id="field-kelompok">
        <label for="pilih-kelompok">Pisahkan berdasarkan (opsional)</label>
        <select id="pilih-kelompok" class="pilih-semua-opsional"></select>
      </div>

      <div class="field" id="field-agregasi">
        <label for="agregasi">Ringkasan nilai</label>
        <select id="agregasi">
          <option value="mean">Rata-rata</option>
          <option value="sum">Jumlah</option>
          <option value="count">Banyak data</option>
          <option value="min">Minimum</option>
          <option value="max">Maksimum</option>
        </select>
      </div>

      <div class="field" id="field-bin" hidden>
        <label for="jumlah-bin">Jumlah interval</label>
        <input type="number" id="jumlah-bin" min="2" max="50" value="8">
      </div>

      <div class="field">
        <label for="judul-grafik">Judul grafik</label>
        <input type="text" id="judul-grafik" placeholder="Tulis judul grafik">
      </div>

      <div class="field">
        <label for="label-x">Label sumbu X</label>
        <input type="text" id="label-x">
      </div>

      <div class="field">
        <label for="label-y">Label sumbu Y</label>
        <input type="text" id="label-y">
      </div>

      <div class="field field-baris">
        <input type="checkbox" id="tampil-legenda" checked>
        <label for="tampil-legenda">Tampilkan legenda</label>
      </div>

      <button type="button" id="btn-buat-grafik" class="btn btn-utama">Buat grafik</button>
    </div>

    <!-- Area grafik -->
    <div class="kartu area-grafik">
      <div class="kanvas-wrap kanvas-besar">
        <canvas id="kanvas-grafik"></canvas>
      </div>
      <p id="kosong-grafik" class="catatan">Pilih jenis grafik dan variabel, lalu klik Buat grafik.</p>
      <button type="button" id="btn-unduh-grafik" class="btn btn-sekunder" hidden>Unduh grafik (PNG)</button>
    </div>

  </div>
</section>

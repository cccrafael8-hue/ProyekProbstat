<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniStat - Pengolah Data Statistik</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===================== MAIN APP CONTAINER ===================== -->
  <div class="page-container">
    <div class="app-wrapper">

      <!-- Backdrop Overlay untuk Mobile Drawer -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- HEADER COMPONENT -->
      <div data-component="components/header.html"></div>

      <!-- LAYOUT SIDEBAR + KONTEN -->
      <div class="layout">

        <!-- SIDEBAR COMPONENT -->
        <div data-component="components/sidebar.html"></div>

        <!-- AREA KERJA UTAMA -->
        <main class="konten">

          <!-- Notifikasi (diisi oleh notifikasi.js) -->
          <div id="notifikasi" class="notifikasi" role="alert" hidden></div>

          <!-- PANEL 1: DATA -->
          <div data-component="components/panel-data.html"></div>

          <!-- PANEL 2: STATISTIK DESKRIPTIF -->
          <div data-component="components/panel-deskriptif.html"></div>

          <!-- PANEL 3: UJI HIPOTESIS -->
          <div data-component="components/panel-uji.html"></div>

          <!-- PANEL 4: VISUALISASI -->
          <div data-component="components/panel-grafik.html"></div>

        </main>
      </div>

      <!-- FOOTER COMPONENT -->
      <div data-component="components/footer.html"></div>

    </div>
  </div>

  <!-- POPUP UNDUH COMPONENT -->
  <div data-component="components/popup-unduh.html"></div>

  <!-- ===================== LIBRARY (CDN) ===================== -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- ===================== MODULAR JAVASCRIPT ===================== -->
  <!-- 1. State Global & Utils -->
  <script src="js/state.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/notifikasi.js"></script>
  <script src="js/utils/data-helpers.js"></script>
  <script src="js/utils/tabel-dom.js"></script>

  <!-- 2. Modul Perhitungan Statistik & Uji Hipotesis (1 file per fungsi) -->
  <script src="js/stat/stat-dasar.js"></script>
  <script src="js/stat/uji-t-satu.js"></script>
  <script src="js/stat/uji-t-independen.js"></script>
  <script src="js/stat/uji-t-berpasangan.js"></script>
  <script src="js/stat/uji-anova.js"></script>
  <script src="js/stat/uji-normalitas.js"></script>
  <script src="js/stat/uji-korelasi.js"></script>
  <script src="js/stat/uji-chi-square.js"></script>
  <script src="js/stat/uji-regresi.js"></script>

  <!-- 3. Modul Fitur Tampilan, Data & Grafik -->
  <script src="js/sidebar.js"></script>
  <script src="js/modules/data-view.js"></script>
  <script src="js/modules/deskriptif.js"></script>
  <script src="js/modules/grafik-helpers.js"></script>
  <script src="js/modules/hipotesis-runner.js"></script>
  <script src="js/modules/visualisasi.js"></script>

  <!-- 4. Loader Komponen & Entry Point Aplikasi -->
  <script src="js/component-loader.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
